# 종소리 찾기 경로 진단 (앱 배포와 무관). 받기 코드나 이 파일을 바꾸면 실행된다.
name: YouTube probe

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/yt_probe.py", ".github/workflows/yt-probe.yml", "app/core/youtube.py", "app/core/ffmpeg.py",
            "app/core/weather.py", "app/core/net.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (앱과 같은 구성)
        run: python -m pip install -r requirements.txt
      - name: Probe (앱에 들어가는 ffmpeg)
        run: python tools/yt_probe.py
