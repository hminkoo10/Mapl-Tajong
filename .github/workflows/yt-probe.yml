# 종소리 찾기 경로 진단 (앱 배포와 무관). 필요할 때 손으로만 실행: Actions → YouTube probe → Run workflow
name: YouTube probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (앱과 같은 구성)
        run: python -m pip install -r requirements.txt
      - name: Probe (앱에 들어가는 ffmpeg)
        run: python tools/yt_probe.py
      - name: 도로명주소 검색 비교
        if: runner.os == 'Linux'
        run: python tools/geo_probe.py --app
