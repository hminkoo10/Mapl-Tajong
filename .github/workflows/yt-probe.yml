# YouTube 받기 경로 진단 (앱 배포와 무관). tools/yt_probe.py 를 바꾸면 실행된다.
name: YouTube probe

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/yt_probe.py", ".github/workflows/yt-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "yt-dlp[default]>=2026.10.26" deno imageio-ffmpeg
      - name: Get bgutil-pot (linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/bin
          gh release download v0.8.1 -R jim60105/bgutil-ytdlp-pot-provider-rs -p bgutil-pot-linux-x86_64 -D build/bin
          mv build/bin/bgutil-pot-linux-x86_64 build/bin/bgutil-pot
          chmod +x build/bin/bgutil-pot
          build/bin/bgutil-pot --version
      - name: Probe
        run: python tools/yt_probe.py
