# Android 앱 빌드·배포
#   - main 에 android/ 가 바뀌면: android/version.properties 의 버전이 아직 배포되지 않았을 때만
#     빌드 → GitHub Release(태그 android-vX.Y.Z)에 APK 를 올린다. 이미 있는 버전이면 아무것도 안 한다.
#   - release/android-vX.Y.Z 브랜치를 만들거나 android-vX.Y.Z 태그를 올려도 배포한다
#   - 그 밖의 브랜치는 Actions → Android → Run workflow 로 손으로 빌드 (APK 는 3일 동안 결과물로 남음)
# 서명 키는 저장소 비밀값 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 로 넣는다.
# 비밀값이 없으면 시험용(디버그) 키로 서명하고, 배포는 하지 않는다 (키가 바뀌면 자동 업데이트가 안 되니까).
name: Android

on:
  push:
    branches: ["main", "release/android-v*"]
    tags: ["android-v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # 배포하는 실행이 중간에 끊기지 않게
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(grep '^versionName=' version.properties | cut -d= -f2)
          code=$(grep '^versionCode=' version.properties | cut -d= -f2)
          publish=0
          skip=0
          case "$GITHUB_REF" in
            refs/heads/release/*|refs/tags/*)
              want="${GITHUB_REF#refs/heads/release/}"
              want="${want#refs/tags/}"
              if [ "$want" != "android-v$name" ]; then
                echo "$want 와 version.properties 의 버전($name)이 달라요"; exit 1
              fi
              publish=1 ;;
            refs/heads/main)
              if gh release view "android-v$name" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                echo "android-v$name 은 이미 배포됐어요. 빌드하지 않아요."
                skip=1
              else
                publish=1
              fi ;;
          esac
          echo "VERSION=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "PUBLISH=$publish" >> "$GITHUB_ENV"
          echo "SKIP=$skip" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: env.SKIP != '1'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != '1'

      - name: Signing key
        if: env.SKIP != '1'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "서명 키: 저장소 비밀값"
          elif [ "$PUBLISH" = "1" ]; then
            echo "배포용 서명 키(저장소 비밀값)가 없어서 배포하지 않아요"; exit 1
          else
            echo "서명 키: 시험용(디버그) 키"
          fi

      - name: Build APK
        if: env.SKIP != '1'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/MaplTajong-${VERSION}.apk"
          (cd out && sha256sum "MaplTajong-${VERSION}.apk" > "MaplTajong-${VERSION}.apk.sha256")
          ls -la out

      # 배포하는 실행은 Release 에 올라가므로, 손으로 돌린 시험 빌드만 결과물로 남김
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1' && env.PUBLISH != '1'
        with:
          name: MaplTajong-android-${{ env.VERSION }}
          path: android/out/*
          retention-days: 3

      - name: Release notes
        if: env.PUBLISH == '1'
        shell: python
        run: |
          import os, re
          v = os.environ["VERSION"]
          path = "CHANGELOG.md" if os.path.exists("CHANGELOG.md") else "../CHANGELOG.md"
          text = open(path, encoding="utf-8").read()
          m = re.search(rf"^##\s*\[?{re.escape(v)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else "더 안정적으로 다듬었어요."
          open("release_notes.md", "w", encoding="utf-8").write(body + "\n")

      - name: Publish GitHub Release
        id: publish_release
        if: env.PUBLISH == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION}" out/MaplTajong-${VERSION}.apk out/MaplTajong-${VERSION}.apk.sha256 \
            --target "$GITHUB_SHA" --title "마고 타종 ${VERSION} (Android)" --notes-file release_notes.md --latest=false

      - name: Clean up release branches
        if: env.PUBLISH == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../tools/cleanup_release_branches.sh

      - name: 마고에듀 서버에 새 버전 알리기 (OIDC)
        if: ${{ !cancelled() && env.PUBLISH == '1' && steps.publish_release.outcome == 'success' }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          # 알림 실패는 경고만 남기고, 이미 끝난 배포 결과에는 영향을 주지 않는다.
          trap 'if [ "$?" -ne 0 ]; then echo "::warning::마고에듀 서버 알림에 실패했습니다. GitHub Release 배포는 유지됩니다."; fi; exit 0' EXIT

          tag="android-v${VERSION}"
          files=("out/MaplTajong-${VERSION}.apk" "out/MaplTajong-${VERSION}.apk.sha256")
          assets_file="$RUNNER_TEMP/release-notification-assets.jsonl"
          payload_file="$RUNNER_TEMP/release-notification.json"
          : > "$assets_file"
          for file in "${files[@]}"; do
            size="$(wc -c < "$file")"
            sha256="$(sha256sum "$file" | cut -d ' ' -f1)"
            jq -cn --arg name "${file##*/}" --argjson size "$size" --arg sha256 "$sha256" \
              '{name: $name, size: $size, sha256: $sha256}' >> "$assets_file"
          done

          jq -n --arg tag "$tag" --arg version "$VERSION" \
            --rawfile notes release_notes.md --slurpfile assets "$assets_file" \
            '{tag: $tag, version: $version, notes: $notes, assets: $assets}' > "$payload_file"

          # OIDC 토큰과 POST 모두 최대 3회 재시도 (기본 대기 1초 → 2초 → 4초).
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 --retry-max-time 120 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --output "$RUNNER_TEMP/release-notification-oidc.json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mago.milky.kr"
          token="$(jq -er '.value | select(type == "string" and length > 0)' "$RUNNER_TEMP/release-notification-oidc.json" | tr -d '\r\n')"
          echo "::add-mask::$token"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 --retry-max-time 120 \
            --header "Authorization: Bearer $token" --header "Content-Type: application/json" \
            --data-binary "@$payload_file" --output /dev/null \
            https://mago.milky.kr/api/ci/releases
          echo "마고에듀 서버에 ${tag} 배포를 알렸습니다."
